name: Agent-Core CI

on:
  push:
    branches: [ main, master, "jules-*", "feat/*", "fix/*", "release/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    name: Run Regression Test Suite & CLI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Pytest Test Suite
        env:
          AGENTCORE_PLANNER_PROVIDER: mock
        run: |
          pytest

      - name: Verify Release ZIP Package
        run: |
          python scripts/validate_ios_release_zip.py

      - name: Verify CLI Smoke Commands
        env:
          AGENTCORE_PLANNER_PROVIDER: mock
        run: |
          python -m core.cli version
          python -m core.cli run "Verify CI smoke test"
          python -m core.cli history
          python -m core.cli benchmark

  ios-xcode-test:
    name: Xcode iOS Simulator Build & Test
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Build & Run iOS Unit Tests via xcodebuild
        run: |
          xcodebuild test \
            -project ios/AgentCoreIOS.xcodeproj \
            -scheme AgentCoreIOS \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  ios-ipa-build:
    name: Build, Package, Validate & Release Unsigned iOS IPA
    runs-on: macos-14
    needs: [test, ios-xcode-test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Build Unsigned iOS Application (.app)
        run: |
          xcodebuild build \
            -project ios/AgentCoreIOS.xcodeproj \
            -scheme AgentCoreIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AgentCoreIOS.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ ERROR: Built AgentCoreIOS.app not found at $APP_PATH"
            exit 1
          fi
          echo "✅ Successfully built real executable AgentCoreIOS.app"

      - name: Package Unsigned IPA Archive
        run: |
          STAGING_DIR="$RUNNER_TEMP/ipa_staging"
          mkdir -p "$STAGING_DIR/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/AgentCoreIOS.app" "$STAGING_DIR/Payload/"

          cd "$STAGING_DIR"
          zip -r "$GITHUB_WORKSPACE/AgentCore-iOS-v0.1.0-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"

          if [ ! -f "AgentCore-iOS-v0.1.0-unsigned.ipa" ]; then
            echo "❌ ERROR: AgentCore-iOS-v0.1.0-unsigned.ipa packaging failed."
            exit 1
          fi
          ls -la AgentCore-iOS-v0.1.0-unsigned.ipa

      - name: Validate Unsigned IPA Archive
        run: |
          python scripts/validate_ipa.py AgentCore-iOS-v0.1.0-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentCore-iOS-v0.1.0-unsigned.ipa
          path: AgentCore-iOS-v0.1.0-unsigned.ipa
          if-no-files-found: error

      - name: Attach Unsigned IPA to GitHub Release v0.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: AgentCore-iOS-v0.1.0-unsigned.ipa
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
