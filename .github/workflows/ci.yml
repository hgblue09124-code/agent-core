name: Agent-Core CI

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Regression Test Suite & CLI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Pytest Test Suite
        env:
          AGENTCORE_PLANNER_PROVIDER: mock
        run: |
          pytest

      - name: Verify CLI Smoke Commands
        env:
          AGENTCORE_PLANNER_PROVIDER: mock
        run: |
          python -m core.cli version
          python -m core.cli run "Verify CI smoke test"
          python -m core.cli history
          python -m core.cli benchmark
