name: Agent-Core CI

on:
  push:
    branches: [ main, master, "jules-*", "feat/*", "fix/*", "release/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Regression Test Suite & CLI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Pytest Test Suite
        env:
          AGENTCORE_PLANNER_PROVIDER: mock
        run: |
          pytest

      - name: Verify Release ZIP Package
        run: |
          python scripts/validate_ios_release_zip.py

      - name: Verify CLI Smoke Commands
        env:
          AGENTCORE_PLANNER_PROVIDER: mock
        run: |
          python -m core.cli version
          python -m core.cli run "Verify CI smoke test"
          python -m core.cli history
          python -m core.cli benchmark

  ios-xcode-test:
    name: Xcode iOS Simulator Build & Test
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Build & Run iOS Unit Tests via xcodebuild
        run: |
          xcodebuild test \
            -project ios/AgentCoreIOS.xcodeproj \
            -scheme AgentCoreIOS \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  ios-ipa-build:
    name: Build, Sign, Validate & Release iOS IPA
    runs-on: macos-14
    needs: [test, ios-xcode-test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Check Apple Signing Credentials
        id: check_secrets
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASS: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT_BASE64" ] && [ -n "$CERT_PASS" ] && [ -n "$PROFILE_BASE64" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "✅ Apple Signing Credentials found in GitHub Secrets."
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️ BLOCKER: Missing required Apple Signing Secrets for direct IPA creation."
            echo "   Required GitHub Secrets:"
            echo "   - APPLE_CERTIFICATE_P12_BASE64"
            echo "   - P12_PASSWORD"
            echo "   - PROVISIONING_PROFILE_BASE64"
            echo "   Directly installable IPA build cannot proceed without signing credentials."
          fi

      - name: Install Apple Certificate and Provisioning Profile
        if: steps.check_secrets.outputs.has_credentials == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASS: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=agentcore_build_temp_pass
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode certificate
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERT_PASS" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH" $(security list-keychains | tr -d '"')

          # Decode provisioning profile
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/build.mobileprovision"
          echo "✅ Certificate and Provisioning Profile installed successfully."

      - name: Archive iOS App
        if: steps.check_secrets.outputs.has_credentials == 'true'
        run: |
          xcodebuild archive \
            -project ios/AgentCoreIOS.xcodeproj \
            -scheme AgentCoreIOS \
            -configuration Release \
            -archivePath $RUNNER_TEMP/AgentCoreIOS.xcarchive

      - name: Export IPA Package
        if: steps.check_secrets.outputs.has_credentials == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AgentCoreIOS.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa_output

          mv $RUNNER_TEMP/ipa_output/*.ipa ./AgentCore-iOS-v0.1.0.ipa
          ls -la ./AgentCore-iOS-v0.1.0.ipa

      - name: Validate Exported IPA
        if: steps.check_secrets.outputs.has_credentials == 'true'
        run: |
          python scripts/validate_ipa.py AgentCore-iOS-v0.1.0.ipa

      - name: Upload IPA Artifact
        if: steps.check_secrets.outputs.has_credentials == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AgentCore-iOS-v0.1.0.ipa
          path: AgentCore-iOS-v0.1.0.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release v0.1.0
        if: steps.check_secrets.outputs.has_credentials == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: AgentCore-iOS-v0.1.0.ipa
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Blocker Status when Credentials Missing
        if: steps.check_secrets.outputs.has_credentials == 'false'
        run: |
          echo "::warning title=IPA Signing Credentials Missing::IPA build step was skipped because Apple signing secrets are not configured in this repository."
          echo "To enable direct IPA creation and automatic GitHub Release upload, configure:"
          echo "  - APPLE_CERTIFICATE_P12_BASE64"
          echo "  - P12_PASSWORD"
          echo "  - PROVISIONING_PROFILE_BASE64"
